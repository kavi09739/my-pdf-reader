<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sola System - Luxury Real Estate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap');
        body { margin: 0; background: #050505; color: white; font-family: 'Outfit', sans-serif; overflow: hidden; }
        canvas { display: block; }
        
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; pointer-events: none; }
        
        .header { text-align: center; }
        .header h1 { font-size: 3rem; margin: 0; background: linear-gradient(to right, #00d4ff, #ff007f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .purchase-card {
            pointer-events: auto; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 30px;
            width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 12px; border: none; background: rgba(255,255,255,0.1); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #00d4ff; color: #000; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="ui-overlay">
    <div class="header">
        <h1>SOLA SYSTEM</h1>
        <p>අභ්‍යවකාශයේ හිමිකාරිත්වය ඔබේ යාළුවන්ට!</p>
    </div>
    <div class="purchase-card">
        <h3 id="p-name">ග්‍රහලෝකය තෝරන්න</h3>
        <p id="p-price" style="color: #00d4ff; font-weight: 600;">මිල: USD 1.5 Billion</p>
        <input type="text" id="buyer" placeholder="මිලදී ගන්නා යාළුවාගේ නම">
        <button onclick="buyPlanet()">සින්නක්කර ඔප්පුව ගන්න</button>
    </div>
</div>

<script>
    // 3D Engine
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Planets
    const planets = [
        {name: "Mercury", color: 0x888888, dist: 4},
        {name: "Venus", color: 0xffcc00, dist: 7},
        {name: "Earth", color: 0x0066ff, dist: 10},
        {name: "Mars", color: 0xff3300, dist: 13}
    ];

    const meshes = planets.map(p => {
        const geo = new THREE.SphereGeometry(1.5, 32, 32);
        const mat = new THREE.MeshPhongMaterial({color: p.color, shininess: 100});
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.x = p.dist;
        scene.add(mesh);
        return mesh;
    });

    const light = new THREE.PointLight(0xffffff, 2, 100);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x222222));
    camera.position.set(0, 5, 20);
    camera.lookAt(0,0,0);

    // Orientation
    window.addEventListener('deviceorientation', (e) => {
        scene.rotation.y = e.gamma / 50;
        scene.rotation.x = e.beta / 50;
    });

    function animate() {
        requestAnimationFrame(animate);
        meshes.forEach(m => m.rotation.y += 0.01);
        renderer.render(scene, camera);
    }
    animate();

    function buyPlanet() {
        const name = document.getElementById('buyer').value;
        if(!name) return alert("කරුණාකර නමක් ඇතුළත් කරන්න!");
        alert(`සාර්ථකයි! ${name} මහතා අභ්‍යවකාශ මූලස්ථානයෙන් ග්‍රහලෝකය මිලදී ගත්තේය. දැන් මේක Screenshot ගහලා යාළුවන්ට යවන්න!`);
    }
</script>
</body>
</html>
